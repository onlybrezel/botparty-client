name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build disposable installer environment
        run: docker build -f tests/installer/Dockerfile -t botparty-installer-test .
      - name: Test install, upgrade, policy failures and systemd unit
        run: docker run --rm botparty-installer-test

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --require-hashes --no-deps -r requirements/build-toolchain.txt
      - run: python -m pip install --require-hashes -r requirements/dev.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python scripts/check-secrets.py
      - run: python scripts/check-doc-links.py
      - run: python scripts/check-repository-layout.py
      - run: python scripts/adapter-inventory.py --check
      - run: python scripts/generate-platform-contract.py --check
      - run: python scripts/check-legacy-deadline.py
      - run: python scripts/check-hil-reports.py --release-profile release-profile.json
      - run: sudo apt-get update && sudo apt-get install -y shellcheck=0.9.0-1
      - run: shellcheck scripts/*.sh tests/installer/*.sh
      - run: bash -n scripts/*.sh tests/installer/*.sh
      - run: BOTPARTY_CLAIM_TOKEN=test-claim-token botparty-robot --config config.example.yaml config validate

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --require-hashes --no-deps -r requirements/build-toolchain.txt
      - run: python -m pip install --require-hashes -r requirements/dev.txt
      - run: python -m pip install --no-deps -e .
      - if: matrix.python-version != '3.12'
        run: pytest -q
      - if: matrix.python-version == '3.12'
        run: >-
          pytest -q --cov=botparty_robot --cov-branch
          --cov-report=xml:coverage.xml --cov-report=json:coverage.json
          --cov-report=html:htmlcov
      - if: matrix.python-version == '3.12'
        run: python scripts/check-coverage.py coverage.json
      - if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        run: >-
          python scripts/check-diff-coverage.py coverage.json
          --base "${{ github.event.pull_request.base.sha }}" --floor 90
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-3.12
          path: |
            coverage.xml
            coverage.json
            htmlcov/
          if-no-files-found: error

  package:
    name: Package and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes --no-deps -r requirements/build-toolchain.txt
      - run: python -m pip install --require-hashes -r requirements/dev.txt
      - run: python -m pip install --no-deps -e .
      - run: pip-audit -r requirements/production.txt
      - run: python -m build --no-isolation
      - run: twine check dist/*
      - name: Enforce package and CLI budgets
        run: >-
          python scripts/check-performance-budgets.py
          --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          --sdist "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          --output dist/performance-ci.json
      - run: python -c "import zipfile; p=next(__import__('pathlib').Path('dist').glob('*.whl')); assert any(n.endswith('.dist-info/licenses/LICENSE') for n in zipfile.ZipFile(p).namelist())"
      - name: Installed-wheel smoke test
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --require-hashes -r requirements/production.txt
          /tmp/wheel-smoke/bin/pip install --no-deps dist/*.whl
          /tmp/wheel-smoke/bin/botparty-robot --help
          /tmp/wheel-smoke/bin/botparty-robot --version
          /tmp/wheel-smoke/bin/python -m botparty_robot --help
      - name: Generate release-profile SBOM
        run: >-
          cyclonedx-py environment /tmp/wheel-smoke/bin/python
          --pyproject pyproject.toml
          --output-reproducible
          --output-file dist/sbom.cdx.json
      - run: >-
          python scripts/generate-license-inventory.py
          --python /tmp/wheel-smoke/bin/python
          --output dist/THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: dist/
          if-no-files-found: error
