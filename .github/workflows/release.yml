name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release provenance
        env:
          RELEASE_ALLOWED_SIGNERS: ${{ secrets.RELEASE_ALLOWED_SIGNERS }}
        run: |
          test -n "$RELEASE_ALLOWED_SIGNERS"
          signer_file="$(mktemp)"
          trap 'rm -f "$signer_file"' EXIT
          printf '%s\n' "$RELEASE_ALLOWED_SIGNERS" > "$signer_file"
          chmod 0600 "$signer_file"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          git -c gpg.format=ssh -c "gpg.ssh.allowedSignersFile=$signer_file" \
            verify-tag "$GITHUB_REF_NAME"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes --no-deps -r requirements/build-toolchain.txt
      - run: python -m pip install --require-hashes -r requirements/dev.txt
      - run: python -m pip install --no-deps -e .
      - name: Match release metadata
        run: |
          version="$(python -c 'import botparty_robot; print(botparty_robot.__version__)')"
          test "$GITHUB_REF_NAME" = "v$version"
          grep -Fq "## [$version]" CHANGELOG.md
      - name: Generate versioned configuration schema
        run: python -m botparty_robot config schema --output dist/robot-config.schema.json
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - run: >-
          python scripts/check-hil-reports.py
          --release-profile release-profile.json
          --client-version "${GITHUB_REF_NAME#v}"
      - name: Verify robot HIL provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -c 'import json; raise SystemExit(json.load(open("release-profile.json"))["mode"] != "robot")'; then
            python - <<'PY' > /tmp/hil-evidence-paths
          import json
          from pathlib import Path
          for report in sorted(Path("reports/hil").glob("**/*.json")):
              if "raw" in report.parts:
                  continue
              payload = json.loads(report.read_text(encoding="utf-8"))
              print(report)
              print(Path("reports/hil") / payload["rawDataFile"])
          PY
            test -s /tmp/hil-evidence-paths
            while IFS= read -r evidence; do
              gh attestation verify "$evidence" --repo "$GITHUB_REPOSITORY"
            done < /tmp/hil-evidence-paths
          fi
      - run: python -m build --no-isolation
      - run: twine check dist/*
      - name: Record immutable build ID
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_sha="$(sha256sum "$wheel" | cut -d' ' -f1)"
          printf 'sha256-%s\n' "$wheel_sha" > dist/BUILD_ID
      - run: pip-audit -r requirements/production.txt
      - name: Build offline OTA bundle
        id: ota
        run: |
          bundle="$(python scripts/build-ota-bundle.py \
            --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            --lock requirements/production.txt \
            --installer-lock requirements/installer.txt)"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
      - name: Enforce package, OTA and CLI budgets
        run: |
          python scripts/check-performance-budgets.py \
            --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            --sdist "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)" \
            --ota "${{ steps.ota.outputs.bundle }}" \
            --output dist/performance-release.json
      - name: Install immutable release artifact
        run: |
          python -m venv /tmp/release-artifact
          /tmp/release-artifact/bin/pip install --require-hashes -r requirements/production.txt
          /tmp/release-artifact/bin/pip install --no-deps dist/*.whl
          BOTPARTY_BUILD_ID="$(cat dist/BUILD_ID)" \
            /tmp/release-artifact/bin/botparty-robot --version
      - name: Generate release-profile SBOM
        run: >-
          cyclonedx-py environment /tmp/release-artifact/bin/python
          --pyproject pyproject.toml
          --output-reproducible
          --output-file dist/sbom.cdx.json
      - run: >-
          python scripts/generate-license-inventory.py
          --python /tmp/release-artifact/bin/python
          --output dist/THIRD_PARTY_NOTICES.md
      - name: Add verified bootstrap artifact
        run: install -m 0755 scripts/bootstrap-install.sh dist/bootstrap-install.sh
      - run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  arm-ota:
    name: Native OTA ${{ matrix.arch }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ARM64
          - arch: armv7
            runner: ARMV7
    runs-on: [self-hosted, Linux, "${{ matrix.runner }}"]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist/
      - name: Install locked release tooling
        run: |
          python3 -m venv /tmp/botparty-arm-release
          /tmp/botparty-arm-release/bin/pip install --require-hashes -r requirements/dev.txt
          /tmp/botparty-arm-release/bin/pip install --no-deps -e .
      - name: Exercise OTA transaction and rollback natively
        run: /tmp/botparty-arm-release/bin/pytest -q tests/test_ota_state_machine.py
      - name: Build native offline OTA bundle
        id: ota
        run: |
          bundle="$(/tmp/botparty-arm-release/bin/python scripts/build-ota-bundle.py \
            --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            --lock requirements/production.txt \
            --installer-lock requirements/installer.txt)"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
      - name: Verify native offline install
        run: |
          rm -rf /tmp/botparty-arm-bundle /tmp/botparty-arm-smoke
          mkdir /tmp/botparty-arm-bundle
          BUNDLE="${{ steps.ota.outputs.bundle }}" python3 - <<'PY'
          import os, zipfile
          zipfile.ZipFile(os.environ["BUNDLE"]).extractall("/tmp/botparty-arm-bundle")
          PY
          python3 -m venv /tmp/botparty-arm-smoke
          /tmp/botparty-arm-smoke/bin/pip install --no-index --require-hashes \
            --find-links /tmp/botparty-arm-bundle/wheelhouse \
            -r /tmp/botparty-arm-bundle/requirements.txt
          /tmp/botparty-arm-smoke/bin/botparty-robot --version
      - name: Record native performance evidence
        run: |
          /tmp/botparty-arm-release/bin/python scripts/check-performance-budgets.py \
            --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            --sdist "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)" \
            --ota "${{ steps.ota.outputs.bundle }}" \
            --iterations 3 \
            --output "dist/performance-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm-ota-${{ matrix.arch }}
          path: |
            ${{ steps.ota.outputs.bundle }}
            dist/performance-${{ matrix.arch }}.json
          if-no-files-found: error

  publish:
    needs: [build, arm-ota]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: arm-ota-*
          path: dist/
          merge-multiple: true
      - name: Sign architecture-bound OTA manifests
        env:
          OTA_ED25519_PRIVATE_KEY: ${{ secrets.OTA_ED25519_PRIVATE_KEY }}
        run: |
          for arch in amd64 arm64 armv7; do
            bundle="$(find dist -maxdepth 1 -name "botparty-robot-*-linux-${arch}.zip" -print -quit)"
            test -n "$bundle"
            python scripts/sign-ota-manifest.py \
              --bundle "$bundle" \
              --bundle-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$bundle")" \
              --version "${GITHUB_REF_NAME#v}" \
              --arch "$arch" \
              --output "dist/ota-manifest-${arch}.json"
          done
      - name: Validate deployment compliance evidence
        env:
          COMPLIANCE_EVIDENCE_JSON: ${{ vars.COMPLIANCE_EVIDENCE_JSON }}
        run: |
          test -n "$COMPLIANCE_EVIDENCE_JSON"
          printf '%s\n' "$COMPLIANCE_EVIDENCE_JSON" > dist/deployment-compliance.json
          python scripts/check-compliance-evidence.py dist/deployment-compliance.json
      - name: Validate monitoring and recovery evidence
        env:
          OPERATIONS_EVIDENCE_JSON: ${{ vars.OPERATIONS_EVIDENCE_JSON }}
        run: |
          test -n "$OPERATIONS_EVIDENCE_JSON"
          printf '%s\n' "$OPERATIONS_EVIDENCE_JSON" > dist/operations-evidence.json
          python scripts/check-operations-evidence.py dist/operations-evidence.json
      - name: Validate platform security and staging evidence
        env:
          PLATFORM_E2E_EVIDENCE_JSON: ${{ vars.PLATFORM_E2E_EVIDENCE_JSON }}
        run: |
          test -n "$PLATFORM_E2E_EVIDENCE_JSON"
          printf '%s\n' "$PLATFORM_E2E_EVIDENCE_JSON" > dist/platform-e2e-evidence.json
          python scripts/check-platform-evidence.py dist/platform-e2e-evidence.json \
            --contract contracts/platform-contract-v1.json \
            --client-version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA"
      - name: Rebuild complete release checksums
        run: |
          rm -f dist/SHA256SUMS
          (cd dist && sha256sum ./* > SHA256SUMS)
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag --generate-notes --prerelease
