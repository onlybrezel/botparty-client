# BotParty robot configuration. Keep this file mode 0600.

server:
  api_url: "https://botparty.live"
  livekit_url: "wss://botparty.live"
  claim_token: "PASTE_YOUR_CLAIM_TOKEN_HERE"
  allow_insecure_dev_transport: false
  # Enable only after the server claim endpoint supports capability manifests.
  report_capabilities_in_claim: false

camera:
  device: "/dev/video0"
  width: 1280
  height: 720
  fps: 25
  backend: "v4l2"
  fourcc: "MJPG"
  buffer_size: 1
  warmup_frames: 4

video:
  type: "ffmpeg"
  options:
    target_bitrate_kbps: 1200

# Optional multi-camera example. Every enabled camera is published continuously.
# cameras:
#   - id: "front"
#     label: "Front"
#     role: "primary"
#     enabled: true
#     publish_mode: "always_on"
#     device: "/dev/v4l/by-id/replace-with-front-camera"
#     width: 1280
#     height: 720
#     fps: 24
#     video:
#       type: "ffmpeg"
#       options:
#         target_bitrate_kbps: 1200
#   - id: "rear"
#     label: "Rear"
#     role: "secondary"
#     enabled: true
#     publish_mode: "always_on"
#     device: "/dev/v4l/by-id/replace-with-rear-camera"
#     width: 640
#     height: 360
#     fps: 12
#     video:
#       type: "ffmpeg"
#       options:
#         target_bitrate_kbps: 350
# audio_source_camera_id: "front"

hardware:
  type: "none"
  options: {}

tts:
  enabled: false
  type: "none"
  playback_device: "default"
  volume: 70
  chat_to_tts: true
  filter_urls: true
  allow_anonymous: false
  blocked_senders: []
  delay_ms: 0
  max_characters: 300
  rate_limit_count: 5
  rate_limit_window_sec: 60
  daily_character_budget: 20000
  operation_timeout_sec: 20
  options: {}

safety:
  max_run_time_ms: 2000
  command_ttl_ms: 2000
  stop_timeout_ms: 1000
  command_queue_size: 64
  require_media_for_motion: true

state:
  # Defaults to $XDG_STATE_HOME/botparty or ~/.local/state/botparty.
  directory: null
  device_key_file: "device-key"

diagnostics:
  upload_enabled: false
  buffer_lines: 400
  batch_lines: 50
  retention_sec: 900
  redaction_literals: []

telemetry:
  operational_enabled: false
  product_analytics_enabled: false

ota:
  enabled: false
  manifest_url: null
  public_key_file: null
  state_directory: null
