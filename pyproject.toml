[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.46.1"]
build-backend = "setuptools.build_meta"

[project]
name = "botparty-robot"
version = "0.2.0"
description = "BotParty Robot Client – connect your robot to the world"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "livekit>=1.1.13",
    "livekit-api>=1.1.1",
    "aiohttp>=3.14.1",
    "pyyaml>=6.0.3",
    "pydantic>=2.13.4",
    "cryptography>=49.0.0",
]

[project.optional-dependencies]
# Vision / OpenCV-based video profiles
vision = [
    "opencv-python-headless>=4.10.0",
    "numpy>=2.0.0",
    "Pillow>=12.3.0",
]
opencv-video = ["botparty-robot[vision]"]
direct-video = []
# Hardware adapters that need additional libraries
hardware = [
    "pyserial>=3.5",
    "paho-mqtt>=2.1.0",
    "pyusb>=1.3.1",
    "RPi.GPIO>=0.7.1; platform_machine == 'armv7l' or platform_machine == 'aarch64'",
]
serial = ["pyserial>=3.5"]
mqtt = ["paho-mqtt>=2.1.0"]
usb = ["pyusb>=1.3.1"]
gpio = [
    "RPi.GPIO>=0.7.1; platform_machine == 'armv7l' or platform_machine == 'aarch64'",
]
# System telemetry
telemetry = [
    "psutil>=5.9.0",
]
polly = ["boto3>=1.42.0"]
google-tts = ["google-cloud-texttospeech>=2.33.0"]
# All optional extras
all = [
    "botparty-robot[vision,hardware,telemetry,polly,google-tts]",
]
# Development / testing
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "mypy>=2.3.0",
    "ruff>=0.15.20",
    "build>=1.4.0",
    "twine>=6.2.0",
    "pip-audit>=2.10.0",
    "pip-tools>=7.5.2",
    "cyclonedx-bom>=7.2.1",
    "types-PyYAML>=6.0.12.20250915",
]

[project.scripts]
botparty-robot = "botparty_robot.__main__:main"

[project.urls]
"Homepage" = "https://botparty.live"
"Documentation" = "https://botparty.live/docs"
"Source" = "https://github.com/onlybrezel/botparty-client"
"Bug Tracker" = "https://github.com/onlybrezel/botparty-client/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["botparty_robot*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # do not perform function calls in default arguments
    "SIM108", # ternary instead of if-else
]

[tool.ruff.lint.per-file-ignores]
"botparty_robot/hardware/hardware_custom_example.py" = ["F401"]
"hardware_custom.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
mypy_path = ["stubs"]
files = [
    "botparty_robot/auth.py",
    "botparty_robot/artifacts.py",
    "botparty_robot/backup.py",
    "botparty_robot/capabilities.py",
    "botparty_robot/client_state.py",
    "botparty_robot/config.py",
    "botparty_robot/device_state.py",
    "botparty_robot/diagnostics.py",
    "botparty_robot/gateway.py",
    "botparty_robot/hardware/base.py",
    "botparty_robot/hardware/common.py",
    "botparty_robot/operator.py",
    "botparty_robot/ota.py",
    "botparty_robot/protocol.py",
    "botparty_robot/safety.py",
    "botparty_robot/systemd.py",
]
